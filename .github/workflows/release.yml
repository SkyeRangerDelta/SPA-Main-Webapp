name: Release & Publish

on:
  push:
    branches: [master, Experimental]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install release deps
        run: npm i -D semantic-release @semantic-release/git @semantic-release/exec
      - name: semantic-release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-push:
    name: Build & Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: spa-main-backend
            context: ./API
          - image: spa-main-frontend
            context: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Moving tags track the head of each release line; the version tag is the
      # immutable one a deployment should actually pin. VERSION is empty when the
      # merged commits did not warrant a release, in which case it is skipped.
      - name: Compute image reference and tags
        id: meta
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/${{ matrix.image }}"
          TAGS=("sha-${GITHUB_SHA::7}")

          case "${GITHUB_REF_NAME}" in
            master)
              TAGS+=("latest")
              if [ -n "${VERSION}" ]; then
                # Floating major/minor tags are stable-only; a prerelease must
                # never be reachable via :1 or :1.7.
                TAGS+=("${VERSION}" "${VERSION%.*}" "${VERSION%%.*}")
              fi
              ;;
            Experimental)
              TAGS+=("experimental")
              if [ -n "${VERSION}" ]; then
                TAGS+=("${VERSION}")
              fi
              ;;
            *)
              TAGS+=("${GITHUB_REF_NAME}")
              ;;
          esac

          ARGS=""
          for t in "${TAGS[@]}"; do
            ARGS="${ARGS} -t ${IMAGE}:${t}"
          done

          {
            echo "image=${IMAGE}"
            echo "args=${ARGS}"
            echo "tags=${TAGS[*]}"
          } >> "$GITHUB_OUTPUT"

          echo "Tagging ${IMAGE} with: ${TAGS[*]}"

      - name: Build Docker image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY,,}" \
            --label "org.opencontainers.image.authors=${{ github.actor }}" \
            --label "org.opencontainers.image.title=${{ matrix.image }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${{ needs.release.outputs.version }}" \
            ${{ steps.meta.outputs.args }} ${{ matrix.context }}

      - name: Push Docker image
        run: docker push --all-tags ${{ steps.meta.outputs.image }}

      - name: Summarize
        run: |
          echo "### ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          for t in ${{ steps.meta.outputs.tags }}; do
            echo "- \`${{ steps.meta.outputs.image }}:${t}\`" >> "$GITHUB_STEP_SUMMARY"
          done

  sync-master-to-experimental:
    name: Sync Experimental
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref_name == 'master'
    steps:
      - name: Checkout Experimental
        uses: actions/checkout@v4
        with:
          ref: Experimental

      - name: Set up Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch latest master
        run: git fetch origin master

      - name: Merge master into Experimental
        run: |
          git merge --no-ff --no-edit origin/master

      - name: Push changes
        run: git push origin HEAD:Experimental
